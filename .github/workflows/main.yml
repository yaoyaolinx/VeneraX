name: Build APK

# Manual-only: builds one arm64 release APK and uploads it as an artifact.
# No signing secrets are required — the APK is signed with the runner's debug
# key and re-signed on the device before install.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Build_Android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rm -rf /opt/hostedtoolcache
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
      - uses: actions/setup-java@v4
        with:
          distribution: 'oracle'
          java-version: '17'
      - name: Check rust-toolchain.toml
        run: rustup show
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: build/app/outputs/apk/release/*.apk